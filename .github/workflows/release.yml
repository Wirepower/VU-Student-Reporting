name: Release Build and Publish

on:
  push:
    branches:
      - release
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional explicit release version in vX.Y format (example: v3.1)'
        required: false
      force_update:
        description: 'Set to true for mandatory update behavior'
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      min_required_tag:
        description: 'Optional minimum client version in vX.Y format (example: v3.1)'
        required: false
        default: ""
      asset_name:
        description: 'Preferred installer asset for in-app updater'
        required: false
        default: "StudentAttendanceReporting-Setup.msi"
      release_notes:
        description: 'Optional release highlights shown above OTA metadata'
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Bundle Java runtime (Temurin 17 JRE)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $apiUrl = "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse"
          $zipPath = Join-Path $env:RUNNER_TEMP "temurin-jre17.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "temurin-jre17"

          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }

          Invoke-WebRequest -Uri $apiUrl -OutFile $zipPath
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force

          $javaExe = Get-ChildItem -Path $extractRoot -Recurse -Filter "java.exe" -File |
            Where-Object { $_.FullName -match "\\bin\\java\.exe$" } |
            Select-Object -First 1

          if (-not $javaExe) {
            throw "Failed to locate java.exe in downloaded Temurin JRE package."
          }

          $javaHome = Split-Path (Split-Path $javaExe.FullName -Parent) -Parent
          if (-not (Test-Path $javaHome)) {
            throw "Unable to resolve Java home from downloaded package."
          }

          if (Test-Path "jre") {
            Remove-Item "jre" -Recurse -Force
          }

          Move-Item -Path $javaHome -Destination "jre"

          if (-not (Test-Path "jre/bin/java.exe")) {
            throw "Bundled runtime validation failed: jre/bin/java.exe not found."
          }

      - name: Install WiX Toolset
        shell: powershell
        run: |
          choco install wixtoolset --yes --no-progress

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $provided = "${{ github.event.inputs.version }}".Trim()
          if ($provided) {
            if ($provided -notmatch '^v\d+\.\d+$') {
              throw "Manual version must match vX.Y (example: v3.1)."
            }
            $tag = $provided
          } else {
            $validTags = git tag -l | Where-Object { $_ -match '^v\d+\.\d+$' }
            if (-not $validTags) {
              $tag = "v1.0"
            } else {
              $latestTag = $validTags |
                Sort-Object { [version](($_.Substring(1)) + ".0") } -Descending |
                Select-Object -First 1

              $latestTag -match '^v(\d+)\.(\d+)$' | Out-Null
              $major = [int] $Matches[1]
              $minor = [int] $Matches[2] + 1
              $tag = "v$major.$minor"
            }
          }

          $version = $tag.Substring(1)
          $installerVersion = "$version.0"
          Write-Host "Selected release tag: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer_version=$installerVersion" >> $env:GITHUB_OUTPUT

      - name: Build release notes and OTA metadata
        id: release_meta
        shell: pwsh
        env:
          FORCE_UPDATE_INPUT: ${{ github.event.inputs.force_update }}
          MIN_REQUIRED_TAG_INPUT: ${{ github.event.inputs.min_required_tag }}
          ASSET_NAME_INPUT: ${{ github.event.inputs.asset_name }}
          RELEASE_NOTES_INPUT: ${{ github.event.inputs.release_notes }}
        run: |
          $forceUpdate = "$env:FORCE_UPDATE_INPUT".Trim().ToLowerInvariant()
          if (-not $forceUpdate) {
            $forceUpdate = "false"
          }
          if ($forceUpdate -notin @("true", "false")) {
            throw "force_update must be true or false."
          }

          $minRequiredTag = "$env:MIN_REQUIRED_TAG_INPUT".Trim()
          if ($minRequiredTag -and $minRequiredTag -notmatch '^v\d+\.\d+$') {
            throw "min_required_tag must match vX.Y (example: v3.1)."
          }

          $assetName = "$env:ASSET_NAME_INPUT".Trim()
          if (-not $assetName) {
            $assetName = "StudentAttendanceReporting-Setup.msi"
          }

          $releaseNotes = "$env:RELEASE_NOTES_INPUT".Trim()

          $bodyDir = "publish/release-artifacts"
          New-Item -ItemType Directory -Path $bodyDir -Force | Out-Null
          $bodyPath = Join-Path $bodyDir "release-notes.md"

          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("## Release highlights")
          $lines.Add("")
          if ($releaseNotes) {
            $lines.Add($releaseNotes)
          } else {
            $lines.Add("- Automated release build from `release` branch.")
          }
          $lines.Add("")
          $lines.Add("## OTA policy metadata")
          $lines.Add("")
          $lines.Add("# force_update: true = mandatory update when this release is newer than installed version.")
          $lines.Add("force_update=$forceUpdate")
          $lines.Add("")
          $lines.Add("# min_required_tag: clients below this version must update before continuing.")
          if ($minRequiredTag) {
            $lines.Add("min_required_tag=$minRequiredTag")
          } else {
            $lines.Add("# min_required_tag not set")
          }
          $lines.Add("")
          $lines.Add("# asset_name: preferred installer asset selected by in-app updater.")
          $lines.Add("asset_name=$assetName")

          Set-Content -Path $bodyPath -Value ($lines -join "`n") -Encoding UTF8

          "body_path=$bodyPath" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained EXE payload
        shell: pwsh
        run: |
          ./build/Publish-ForInstaller.ps1 `
            -SelfContained `
            -Runtime "win-x64" `
            -Configuration "Release" `
            -OutputPath "publish/installer-payload/win-x64" `
            -VersionPrefix "${{ steps.version.outputs.version }}" `
            -AssemblyVersion "${{ steps.version.outputs.version }}" `
            -FileVersion "${{ steps.version.outputs.version }}"

      - name: Build WiX MSI
        shell: pwsh
        run: |
          ./build/Build-WixMsi.ps1 `
            -PayloadDirectory "publish/installer-payload/win-x64" `
            -OutputDirectory "publish/release-artifacts" `
            -ProductVersion "${{ steps.version.outputs.installer_version }}"

      - name: Stage EXE for release assets
        shell: pwsh
        run: |
          $assetDir = "publish/release-artifacts"
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null

          $exe = Get-ChildItem "publish/installer-payload/win-x64" -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch '^vshost\.' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "No executable file found in publish/installer-payload/win-x64."
          }

          $targetExe = Join-Path $assetDir "StudentAttendanceReporting.exe"
          Copy-Item $exe.FullName $targetExe -Force

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.release_meta.outputs.body_path }}
          generate_release_notes: false
          make_latest: true
          files: |
            publish/release-artifacts/StudentAttendanceReporting.exe
            publish/release-artifacts/StudentAttendanceReporting-Setup.msi
